name: Update NextFootball four resource packs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-nextfootball-packs.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Merge shader-free ItemsAdder emote models into four packs
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, gzip, base64, re, hashlib
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED, ZipInfo
          packed = ""
          assets = {name: data.encode('utf-8') for name, data in json.loads(gzip.decompress(base64.b64decode(packed))).items()}
          jobs = [
             ('GFC 1.21 (NextFB ball)V3 (1).zip', 'old', 'NextFB'),
             ('GFC 1.21 (Hypixel ball)V3 (1).zip', 'old', 'Hypixel'),
             ('GCF 1.21.11 (NextFB ball).zip', 'new', 'NextFB'),
             ('GCF 1.21.11 (Hypixel ball).zip', 'new', 'Hypixel'),
          ]
          def excluded(s):
              return bool(re.search(r'(^|/)(font|fonts|shaders)(/|$)', s, re.I)) or s.startswith(('assets/space/lang/','assets/minecraft/lang/',''))
          def mcmeta(ver, flavor):
              if ver == 'new':
                  payload={'pack':{'pack_format':46,'supported_formats':{'min_inclusive':46,'max_inclusive':64},'min_format':46,'max_format':[75,0],'description':f'NextFootball {flavor.lower()} + ItemsAdder modern emotes (1.21.4-1.21.11; no fonts/shaders)'},'overlays':{'entries':[{'directory':'ia_overlay_1_21_4_to_5','formats':[46,55]},{'directory':'ia_overlay_1_21_6_plus','formats':[63,75],'min_format':63,'max_format':[75,0]}]}}
              else:
                  payload={'pack':{'pack_format':34,'supported_formats':{'min_inclusive':34,'max_inclusive':42},'description':f'NextFootball {flavor.lower()} (1.21-1.21.3; no fonts/shaders)'}}
              return (json.dumps(payload, ensure_ascii=False,indent=2)+'\n').encode()
          for name, version, flavor in jobs:
              src = Path(name)
              with ZipFile(src) as z:
                  entries = {n:z.read(n) for n in z.namelist() if not n.endswith('/') and not excluded(n)}
              for p, raw in assets.items():
                  if version == 'new' and p=='assets/minecraft/models/item/player_head.json': continue
                  if version == 'old' and p.startswith('ia_overlay_'): continue
                  if p in entries and entries[p] != raw:
                      raise RuntimeError('Asset conflict: '+name+' / '+p)
                  entries[p] = raw
              # Restore original OptiFine sky/menu assets in the older Hypixel pack;
              # they are unrelated to font replacement or entity shaders.
              if version == 'old' and flavor == 'Hypixel':
                  import subprocess, io
                  original_blob = subprocess.check_output(
                      ['git', 'show', '0be8245a1a27be207e6e757e94d3e4ba62df5e5e:' + name])
                  with ZipFile(io.BytesIO(original_blob)) as original_zip:
                      for asset_path in original_zip.namelist():
                          if asset_path.startswith('assets/minecraft/optifine/') and not asset_path.endswith('/') and not excluded(asset_path):
                              entries[asset_path] = original_zip.read(asset_path)
              entries['pack.mcmeta'] = mcmeta(version, flavor)
              dst = Path(name+'.new')
              with ZipFile(dst,'w',compression=ZIP_DEFLATED,compresslevel=7) as z:
                  stamp = (2026, 11, 18, 20, 50, 16 if name == 'GCF 1.21.11 (Hypixel ball).zip' else 14)
                  for key in sorted(entries):
                      zi = ZipInfo(key, stamp)
                      zi.compress_type = ZIP_DEFLATED
                      zi._compresslevel = 7
                      zi.external_attr = 0o600 << 16
                      z.writestr(zi, entries[key])
              with ZipFile(dst) as z:
                  assert z.testzip() is None
                  for p in z.namelist():
                      assert not excluded(p), p
                      if p.endswith(('.json','.mcmeta')): json.loads(z.read(p))
                  ball='assets/minecraft/items/diamond_block.json' if version=='new' else 'assets/minecraft/models/item/diamond_block.json'
                  assert ('hypixel_ball' in z.read(ball).decode('utf-8')) == (flavor=='Hypixel')
                  assert 'assets/_iainternal/models/entity/player/phead_0.json' in z.namelist()
              print('Prepared',name,dst.stat().st_size,'sha1',hashlib.sha1(dst.read_bytes()).hexdigest())
              dst.replace(src)
          PYCODE
      - name: Commit resource packs at existing paths
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.zip'
          if git diff --cached --quiet; then
            echo 'No changes'; exit 0
          fi
          git commit -m 'Update four resource packs with ItemsAdder emotes (font/shader-free)'
          git push origin HEAD:main
